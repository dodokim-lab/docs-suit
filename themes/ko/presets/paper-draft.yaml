# docs-suit 테마 조합. suit.py preset use <이름> 으로 내 슬롯에 입힌다.
# 공개 저장소에 올라가므로 페르소나와 회사, 사람 이름은 넣지 않는다.

preset:
  label: 논문 초고
  desc: 논문 초고를 평어체로, 목적과 방법, 결과, 고찰 순서와 APA 참고문헌으로 쓴다
  by: dodokim-lab
  class: researcher
  featured: true

defaults:
  skeleton: imrad
  voice: prose
  register: plain
  terms: major
  length: full
  sources: apa
  emphasis: none
  diagram: table

# 문서 종류가 권하는 출처 표기(보고서는 각주)를 이기려고 독자별 값에도 둔다.
# 조합의 어법이 독자의 기본 어법을 이겨서, 윗사람과 바깥 독자에게 쓰는 글의 어법은 독자별 값으로 되돌린다.
audiences:
  professor: {sources: apa}
  reviewer: {sources: apa}
  manager: {register: polite}
  stakeholder: {register: polite}
  client: {register: polite}
  listener: {register: polite}
  recruiter: {register: polite}
  teammate: {register: haeyo}
